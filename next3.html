<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kejutan!</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #ffffff;
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        /* --- STYLING UNTUK POP-UP ANTI-CURANG --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 25px;
            max-width: 300px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .modal-content p {
            color: #4a4a4a;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 15px 0 20px 0;
        }

        .btn-oke {
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 10px 30px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
        }

        .btn-oke:hover {
            background-color: #ff1493;
        }

        /* -------------------------------------- */

        /* Konten Utama (Disembunyikan di awal) */
        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Konten muncul perlahan jika aman */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            z-index: 10;
            opacity: 0;
            animation: fadeIn 3s ease forwards;
            animation-delay: 0.5s;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .gif-container {
            width: 220px;
            max-width: 100%;
            pointer-events: none;
            margin-bottom: 15px;
        }

        h1 {
            color: #ff69b4;
            font-size: 1.5rem;
            background-color: #fff0f5;
            padding: 12px 30px;
            border-radius: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.15);
        }

        .btn-y {
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: bold;
            padding: 12px 35px;
            font-size: 18px;
            background-color: #ff69b4;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            transition: all 0.2s ease;
        }

        .btn-y:hover {
            background-color: #ff1493;
            transform: scale(1.1);
        }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <!-- --- ELEMEN POP-UP ANTI-CURANG --- -->
    <div id="cheat-alert" class="modal-overlay">
        <div class="modal-content">
            <div class="gif-container" style="margin-bottom: 0;">
                <div class="tenor-gif-embed" data-postid="3054031450086877982" data-share-method="host"
                    data-aspect-ratio="1" data-width="100%">
                    <a href="https://tenor.com/view/bubu-dudu-sseeyall-gif-3054031450086877982">Bubu Dudu Sseeyall
                        Sticker</a>from
                    <a href="https://tenor.com/search/bubu+dudu-stickers">Bubu Dudu Stickers</a>
                </div>
            </div>
            <p>Harus berurutan dari awal ya sayangg</p>
            <button id="btn-back" class="btn-oke">Oke</button>
        </div>
    </div>

    <!-- Konten Utama Halaman -->
    <div id="main-content">
        <div class="content-container">
            <div class="gif-container">
                <div class="tenor-gif-embed" data-postid="16875952118185107582" data-share-method="host"
                    data-aspect-ratio="1" data-width="100%">
                    <a href="https://tenor.com/view/bubu-dudu-sseeyall-gif-16875952118185107582">Bubu Dudu Sseeyall
                        Sticker</a>from
                    <a href="https://tenor.com/search/bubu+dudu-stickers">Bubu Dudu Stickers</a>
                </div>
            </div>

            <h1>Tidak ada hadiah disini</h1>

            <button id="btn-y" class="btn-y">Y</button>
        </div>
    </div>

    <!-- Script Tenor dipanggil satu kali -->
    <script type="text/javascript" async src="https://tenor.com/embed.js"></script>

    <script>
        // --- LOGIKA ANTI-CURANG ---
        // Cek apakah dia punya izin dari next2.html
        if (!sessionStorage.getItem('izin_next3')) {
            document.getElementById('cheat-alert').classList.add('show');
            document.getElementById('btn-back').addEventListener('click', () => {
                window.location.href = 'index.html';
            });
        } else {
            // Jika punya izin, tampilkan konten utama (ini juga memicu CSS fadeIn otomatis)
            document.getElementById('main-content').style.display = 'flex';

            // --- LOGIKA NORMAL HALAMAN NEXT3 ---
            const btnY = document.getElementById('btn-y');
            const icons = ['fa-star', 'fa-heart'];
            const colors = ['#ff69b4', '#ff1493', '#ffd700', '#00bfff', '#9370db', '#ff4500', '#32cd32'];

            function createMassiveExplosion() {
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                const particleCount = 80;

                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('i');
                    const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                    const randomColor = colors[Math.floor(Math.random() * colors.length)];

                    particle.classList.add('fa-solid', randomIcon, 'particle');
                    particle.style.color = randomColor;
                    particle.style.left = `${centerX}px`;
                    particle.style.top = `${centerY}px`;

                    document.body.appendChild(particle);

                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 300 + 100;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;

                    const animation = particle.animate([
                        { transform: `translate(-50%, -50%) scale(0.5) rotate(0deg)`, opacity: 1 },
                        { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${Math.random() * 2 + 1}) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                    ], {
                        duration: 1500 + Math.random() * 1000,
                        easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
                        fill: 'forwards'
                    });

                    animation.onfinish = () => {
                        particle.remove();
                    };
                }
            }

            // Jalankan ledakan karena sudah dipastikan dia tidak curang
            createMassiveExplosion();

            btnY.addEventListener('click', () => {
                // Beri izin untuk ke halaman next4.html
                sessionStorage.setItem('izin_next4', 'true');
                window.location.href = 'next4.html';
            });
        }
    </script>

</body>

</html>
